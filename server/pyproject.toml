[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lightroom-mcp"
version = "0.1.0"
description = "MCP server for Adobe Lightroom Classic"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
lightroom-mcp = "lightroom_mcp:main"
